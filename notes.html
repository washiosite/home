<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Washio Notes | WashioWeb</title>

<meta name="description" content="WashioWebのメモアプリ">

<link rel="icon" href="assets/favicon/notes.svg">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background"></div>

<header class="navbar glass">

    <a href="index.html" class="logo">
        WashioWeb
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="notes.html">Notes</a>
    </nav>

</header>

<main class="container">

    <section class="glass page-header">

        <h1>📝 Washio Notes</h1>

        <p>
            アイデアやメモを保存できます
        </p>

    </section>

    <section class="glass note-editor">

        <h2>新しいメモ</h2>

        <textarea
            id="noteInput"
            placeholder="ここにメモを入力..."
        ></textarea>

        <button id="saveBtn">
            保存する
        </button>

    </section>

    <section>

        <h2 class="section-title">
            保存済みメモ
        </h2>

        <div id="notesList" class="notes-grid">

            <div class="glass note-card">

                <h3>
                    2026/06/04
                </h3>

                <p>
                    サンプルメモです。
                </p>

            </div>

            <div class="glass note-card">

                <h3>
                    2026/06/03
                </h3>

                <p>
                    WashioWebのデザイン案を考える
                </p>

            </div>

        </div>

    </section>

</main>

</body>
</html>
